<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E7" />
    <title>Escargot Express</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M10 82h70q14 0 14-20' fill='none' stroke='%23c99e6c' stroke-width='14' stroke-linecap='round'/%3E%3Ccircle cx='45' cy='48' r='32' fill='%23d9784a' stroke='%238e4a2e' stroke-width='6'/%3E%3Cpath d='M45 48m-6 0a6 6 0 1 1 12 0a12 12 0 1 1-24 0a18 18 0 1 1 36 0' fill='none' stroke='%239b5534' stroke-width='5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/game/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">
          <canvas id="logo" class="logo" aria-hidden="true"></canvas>
          <h1>Escargot Express</h1>
          <button id="settings-open" class="icon small" aria-label="Personnaliser"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4c0-4.6-4-8.2-9-8.2Z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7.2" r="1.2" fill="currentColor"/><circle cx="14.5" cy="7.2" r="1.2" fill="currentColor"/></svg></button>
        </div>
        <div class="tabs" role="tablist">
          <button id="tab-campaign" class="tab active" role="tab" aria-selected="true">Campagne</button>
          <button id="tab-daily" class="tab" role="tab" aria-selected="false">Défi du jour</button>
        </div>
      </header>

      <section class="bar">
        <button id="prev" class="icon" aria-label="Niveau précédent">‹</button>
        <div class="title">
          <div id="level-label">Niveau 1</div>
          <div id="level-meta" class="meta"></div>
        </div>
        <button id="next" class="icon" aria-label="Niveau suivant">›</button>
      </section>

      <div class="status">
        <span class="timer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="timer">0:00</span></span>
        <span id="progress" class="progress">0 %</span>
      </div>

      <div class="board-wrap">
        <canvas id="board" aria-label="Plateau de jeu"></canvas>

        <div id="win" class="overlay hidden" role="dialog" aria-live="polite">
          <div class="card">
            <canvas id="win-art" class="win-art" aria-hidden="true"></canvas>
            <h2 id="win-title">Bravo !</h2>
            <p id="win-text"></p>
            <button id="win-next" class="primary">Niveau suivant</button>
          </div>
        </div>
      </div>

      <p id="message" class="message" aria-live="polite"></p>

      <section class="controls">
        <button id="reset" class="secondary"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>Recommencer</span></button>
        <button id="hint" class="secondary"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z"/></svg><span>Indice</span></button>
      </section>
    </main>

    <div id="settings" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="sheet">
        <div class="sheet-head">
          <h2 id="settings-title">Personnaliser</h2>
          <button id="settings-close" class="icon small" aria-label="Fermer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <canvas id="preview" class="preview" aria-hidden="true"></canvas>
        <h3>Ton animal</h3>
        <div id="character-list" class="choices"></div>
        <h3>Couleur des feuilles</h3>
        <div id="leaf-list" class="swatches"></div>
      </div>
    </div>
    <script type="module" src="./src/game/main.ts"></script>
  </body>
</html>
